name: SEIM Vercel web

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: seim-vercel-web-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  verify:
    uses: ./.github/workflows/seim-verify.yml

  preview:
    needs: verify
    if: github.event_name == 'pull_request'
    environment:
      name: preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: "."
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull preview environment
        run: vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build preview
        run: vercel build --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy preview
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify preview health
        run: curl --fail --show-error --silent --retry 5 --retry-all-errors "${{ steps.deploy.outputs.url }}"

  production:
    needs: verify
    if: github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: "."
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build production
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy production
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify production health
        run: curl --fail --show-error --silent --retry 5 --retry-all-errors "${{ steps.deploy.outputs.url }}"
